services:
  # Primary HRMS Web & API Service
  hrms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hrms-enterprise-backend:latest
    container_name: hrms_backend
    restart: always
    ports:
      - "${PORT:-8000}:80"
    environment:
      - APP_NAME=HRMS Enterprise
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-base64:VN5QmQqBVmyYvEyQd4qSH22AoZYrbHTIxwJGjamgSDs=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - APP_TIMEZONE=Asia/Kolkata
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
    volumes:
      - hrms_database:/var/www/html/database
      - hrms_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Cloudflare Tunnel: Automatically assigns a free, public HTTPS domain (*.trycloudflare.com)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hrms_cloudflare_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://hrms-backend:80
    depends_on:
      - hrms-backend

volumes:
  hrms_database:
    name: hrms_database
  hrms_storage:
    name: hrms_storage
